name: Release

on:
  push:
    branches:
      - master

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    name: Maintain the release PR
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      # release-please only ever OPENS the release PR - it never approves or
      # merges it. Opening one with the default GITHUB_TOKEN requires
      # Settings > Actions > General > Workflow permissions >
      # "Allow GitHub Actions to create and approve pull requests".
      # If that toggle is unavailable (org-enforced), set a RELEASE_PLEASE_TOKEN
      # secret to a PAT with contents:write + pull-requests:write instead; it is
      # preferred automatically when present.
      - name: Run release-please
        id: release
        uses: googleapis/release-please-action@v4
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}

  # Only runs on the push that merges a release PR, when the tag and the
  # GitHub release already exist. HACS downloads the asset attached here.
  publish:
    name: Attach the HACS artifact
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout the released tag
        uses: actions/checkout@v6.0.1
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install the Python required by pyproject.toml
        run: uv python install 3.14

      - name: Build the HACS artifact
        run: ./release.sh

      - name: Upload the artifact to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          gh release upload "${{ needs.release-please.outputs.tag_name }}"
          dist/philips_sicp_display.zip --clobber
